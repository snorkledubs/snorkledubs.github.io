<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Portfolio</title>
  <meta name="description" content="Personal portfolio and project showcase.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-brand" id="nav-brand">Portfolio</a>
    <div class="nav-links">
      <a href="#about">About</a>
      <a href="#projects" id="nav-projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#timeline">Timeline</a>
      <a href="#blog">Writeups</a>
      <a href="#contact">Contact</a>
      <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">&#9680;</button>
    </div>
  </nav>

  <main>
    <header class="hero" id="top">
      <div class="hero-inner">
        <img class="avatar" id="avatar" alt="" hidden>
        <p class="hero-role" id="hero-role"></p>
        <h1 class="hero-name" id="hero-name"></h1>
        <p class="hero-tagline" id="hero-tagline"></p>
        <div class="hero-actions">
          <a href="#projects" class="btn btn-primary">View projects</a>
          <a href="#contact" class="btn btn-ghost">Get in touch</a>
        </div>
        <div class="social" id="social"></div>
      </div>
    </header>

    <section id="about" class="section">
      <h2>About</h2>
      <div class="about-text" id="about-text"></div>
    </section>

    <section id="projects" class="section">
      <h2>Projects</h2>
      <div class="filters" id="filters"></div>
      <div class="grid" id="projects-grid"></div>
    </section>

    <section id="timeline" class="section">
      <h2>Timeline</h2>
      <ol class="timeline" id="timeline-list"></ol>
    </section>

    <section id="blog" class="section">
      <h2>Writeups</h2>
      <div class="posts" id="posts"></div>
    </section>

    <section id="skills" class="section">
      <h2>Skills</h2>
      <div class="skills" id="skills"></div>
    </section>

    <section id="contact" class="section">
      <h2>Contact</h2>
      <p class="contact-text">Want to work together or just say hi?</p>
      <a class="btn btn-primary" id="contact-btn" href="#">Email me</a>
    </section>
  </main>

  <footer class="footer">
    <span id="footer-text"></span>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
