<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azal — strapped in</title>
<meta name="description" content="Azal's portfolio. Sit down, look at a screen, click it.">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07090f">
<link rel="preload" href="assets/fonts/7fb4b2b2.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/f3a345e9.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="room.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading">TUNING<span>...</span></div>
<noscript><div class="nogl">This page needs JavaScript. <a href="classic.html">Plain version</a></div></noscript>
<div id="nogl" class="nogl" hidden>Your browser couldn't start WebGL. <a href="classic.html">Open the plain version</a></div>
<div id="vig"></div><div id="scan"></div>
<div id="dot"></div>
<div id="label"></div>
<div id="hint">MOUSE: LOOK · CLICK A TV TO WATCH · L: LOOK MODE</div>
<div id="mode"></div>
<div id="topL"><button class="btn" id="bCust">Customize Azal</button></div>
<div id="topR"><button class="btn" id="bSnd">Sound: on</button><a class="btn" href="classic.html">Plain</a></div>

<div id="cust">
  <canvas id="prev" width="144" height="240"></canvas>
  <h3>Name</h3><input type="text" id="cName" maxlength="14">
  <h3>Star color</h3><div class="sw" id="cStar"></div>
  <h3>Points</h3><input type="range" id="cPts" min="5" max="9" step="1">
  <h3>Spikiness</h3><input type="range" id="cSharp" min="0.35" max="0.6" step="0.01">
  <h3>Face</h3><div class="seg" id="cFace"></div>
  <h3>Eye color</h3><div class="sw" id="cEye"></div>
  <h3>Shirt</h3><div class="sw" id="cShirt"></div>
  <h3>Top</h3><div class="seg" id="cTop"></div>
  <h3>Extras (chain, studs, brow bar stay on)</h3><div class="seg" id="cGl"></div>
  <h3>Voice pitch</h3><input type="range" id="cVoice" min="180" max="700" step="10">
</div>

<div id="panel"><button class="btn x" id="bClose">Esc</button><div id="pBody"></div></div>

<div id="remote" hidden aria-label="Remote control">
  <button data-r="power" title="Turn off (Esc)">&#9211;</button>
  <div class="rrow"><button data-r="chdn" title="Previous TV (up arrow)">CH&minus;</button><button data-r="chup" title="Next TV (down arrow)">CH+</button></div>
  <div class="rrow"><button data-r="prev" title="Previous page (left arrow)">&#9664;</button><button data-r="ok" title="Open link / continue (Enter)">OK</button><button data-r="next" title="Next page (right arrow)">&#9654;</button></div>
  <button data-r="txt" title="Read as text (T)">TXT</button>
</div>

<div id="dlg"><canvas id="face" width="200" height="200"></canvas><div id="txt"></div><div id="more">▼</div></div>

<script src="data.js"></script>
<script type="module" src="room.bundle.js"></script>


</body></html>
